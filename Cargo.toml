[package]
name = "embedded-tls"
version = "0.19.0"
edition = "2024"
description = "TLS 1.3 client with no_std support and no allocator"
documentation = "https://docs.rs/embedded-tls"
readme = "README.md"
homepage = "https://drogue.io"
repository = "https://github.com/drogue-iot/embedded-tls"
license = "Apache-2.0"
keywords = ["embedded", "async", "tls", "no_std", "network"]
exclude = [".github"]

[package.metadata.docs.rs]
features = ["webpki", "rustpki", "rsa", "ed25519", "p384"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
portable-atomic = { version = "1.15.0", default-features = false }
p256 = { version = "0.14", default-features = false, features = [ "ecdh", "ecdsa", "sha256", "pkcs8" ] }
p384 = { version = "0.14", default-features = false, features = [ "ecdsa", "ecdh", "sha384", "pkcs8" ], optional = true }
ed25519-dalek = { version = "3.0.0", default-features = false, optional = true }
rsa = { version = "0.10.0-rc.18", default-features = false, features = ["sha2", "encoding"], optional = true }
rand_core = { version = "0.10.1", default-features = false }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes"] }
digest = { version = "0.11.3", default-features = false, features = ["mac"] }
aead = { version = "0.6.1", default-features = false }
subtle = { version = "2.6.1", default-features = false }
typenum = { version = "1.20.1", default-features = false }
heapless = { version = "0.9.3", default-features = false }
embedded-io = "0.7.1"
embedded-io-async = "0.7"
embedded-io-adapters = { version = "0.7", optional = true }
webpki = { package = "rustls-webpki", version = "0.103.15", default-features = false, features = ["ring", "alloc"], optional = true }
pki-types = { package = "rustls-pki-types", version = "1.15", default-features = false, optional = true }
const-oid = { version = "0.10.2", optional = true }
der = { version = "0.8.2", features = ["derive", "oid", "heapless"], optional = true }
signature = { version = "3.0", default-features = false }
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "c0fdd08e94138105fba8be3133c4ced91afc30fc", default-features = false, optional = true }
ecdsa = { version = "0.17", default-features = false }

# Logging alternatives
log = { version = "0.4", optional = true }
defmt = { version = "1.1.1", optional = true }

[dev-dependencies]
env_logger = "0.11.11"
tokio = { version = "1.53", features = ["full"] }
mio = { version = "1.2.3", features = ["os-poll", "net"] }
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.10.2"
log = "0.4"
pem-parser = "0.1.1"
openssl = "0.10.81"

[features]
default = ["std", "log", "tokio"]
defmt = ["dep:defmt", "embedded-io/defmt", "heapless/defmt"]
std = ["embedded-io/std", "embedded-io-async/std"]
tokio = ["embedded-io-adapters/tokio-1"]
alloc = []
webpki = ["dep:webpki", "dep:pki-types"]
rustpki = ["dep:der","dep:const-oid"]
rsa = ["dep:rsa", "rustpki", "alloc"]
ed25519 = ["dep:ed25519-dalek", "rustpki"]
p384 = ["dep:p384", "rustpki"]
embassy-crypto = ["dep:embassy-crypto"]
